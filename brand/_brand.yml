meta:
  name: philvized
  link:
    github: https://github.com/philvized
    facebook: https://facebook.com/philvized
    instagram: https://instagram.com/philvized
    youtube: https://youtube.com/@philvized

logo:
  images:
    primary: logos/full-light.svg
    full-dark: logos/full-dark.svg
    ico-light: logos/icon-light.svg
    ico-dark: logos/icon-dark.svg
  small: ico-light
  medium:
    light: ico-dark
    dark: ico-light
  large:
    light: full-dark
    dark: primary

color:
  palette:
    black: "#000014"
    white: "#ebebff"

    dark-blue: "#000033"
    orange: "#ff6600"
    lavender: "#9494D1"

    violet: "#2929B5"
    violet2: "#5656BB"
    red: "#800000"
    maroon: "#330000"
    brown: "#331400"
    green: "#999900"
    yellow: "#FFB94D"

    # Bootstrap color aliases
    blue: dark-blue
    gray: lavender

  foreground:
    light: black
    dark: white 
  background:
    light: white
    dark: black
  primary:
    light: dark-blue
    dark: orange
  secondary: lavender
  info: blue
  success: green
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
    - family: Montserrat
      source: google
  headings:
    family: Montserrat
    weight: 700
    color:
      light: dark-blue
      dark: white

